name: Run Unit Tests (Tkinter Safe)

on:
  push:
    branches:
      - paakofinyarkoh52-task1.2
  pull_request:
    branches:
      - paakofinyarkoh52-task1.2

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies (optional)
        run: |
          pip install -r requirements.txt || true

      - name: Install xvfb for Tkinter GUI tests
        run: sudo apt-get install -y xvfb

      - name: Run unittest with virtual display
        run: |
          xvfb-run -a python -m unittest discover -s . -p "*test*.py"

