name: CI

on:
  push:
    branches: [ "Task_2.2-frontend-add_or_remove_course" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Run my tests
        run: python -m unittest test_app.py
